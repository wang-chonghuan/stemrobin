<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>知识星图 · 原型</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070f; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .hub-label {
    position: absolute; transform: translate(-50%, -140%);
    color: rgba(235, 240, 255, 0.92); white-space: nowrap;
    font-family: "PingFang SC", "Noto Sans SC", sans-serif;
    text-shadow: 0 0 6px rgba(0,0,0,.9), 0 1px 2px rgba(0,0,0,.9);
    letter-spacing: 0.06em; user-select: none;
    transition: opacity .25s ease, color .25s ease;
  }
  .hub-label.dim { opacity: 0.22; }
  .hub-label.hot { color: #fff; text-shadow: 0 0 14px currentColor, 0 1px 2px rgba(0,0,0,.9); }
  .star-label {
    position: absolute; transform: translate(-50%, -160%); white-space: nowrap;
    font-family: "PingFang SC", "Noto Sans SC", sans-serif; font-size: 11px;
    text-shadow: 0 0 5px rgba(0,0,0,.95), 0 1px 2px rgba(0,0,0,.95);
    letter-spacing: 0.03em; user-select: none; transition: opacity .25s ease;
  }
  #tooltip {
    position: fixed; pointer-events: none; display: none; max-width: 300px;
    background: rgba(10, 14, 28, 0.92); border: 1px solid rgba(120,150,255,0.25);
    border-radius: 8px; padding: 8px 12px; color: #dfe6ff;
    font: 13px/1.5 "PingFang SC", "Noto Sans SC", sans-serif;
    box-shadow: 0 4px 24px rgba(0,0,0,.5); z-index: 10;
  }
  #tooltip .trail { color: #8b97c9; font-size: 11px; margin-top: 2px; }
  #hint {
    position: fixed; left: 16px; bottom: 14px; color: #55608a;
    font: 12px/1.6 "PingFang SC", sans-serif; pointer-events: none;
  }
  #legend {
    position: fixed; right: 16px; bottom: 14px; color: #8b97c9;
    font: 12px/1.8 "PingFang SC", sans-serif; pointer-events: none; text-align: right;
  }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  #lang {
    position: fixed; top: 14px; right: 16px; z-index: 20; cursor: pointer;
    background: rgba(16, 22, 44, 0.7); color: #aab6e8;
    border: 1px solid rgba(120,150,255,0.25); border-radius: 999px;
    padding: 4px 14px; font: 12px/1.6 "PingFang SC", "Noto Sans SC", sans-serif;
    letter-spacing: 0.04em;
  }
  #lang:hover { color: #fff; border-color: rgba(150,180,255,0.55); }
</style>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>
<div id="tooltip"></div>
<div id="hint"></div>
<div id="legend">
  <div><span class="dot" id="dot-math"></span><span id="legend-math"></span></div>
  <div><span class="dot" id="dot-physics"></span><span id="legend-physics"></span></div>
</div>
<button id="lang"></button>
<script type="importmap">
  { "imports": { "three": "./node_modules/three/build/three.module.js" } }
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
