<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img"><title>Perpendiculars are parallel</title><desc>Lines m and n are both perpendicular to line l.</desc><g fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="35" y1="75" x2="325" y2="75" stroke="currentColor" stroke-width="3"/><line x1="35" y1="155" x2="325" y2="155" stroke="currentColor" stroke-width="3"/><line x1="190" y1="25" x2="190" y2="200" stroke="currentColor" stroke-width="3"/><rect x="190" y="75" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"/><rect x="172" y="137" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"/><text x="25" y="79" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="currentColor">m</text><text x="25" y="159" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="currentColor">n</text><text x="198" y="22" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="currentColor">l</text><text x="215" y="100" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="currentColor">90°</text><text x="150" y="145" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="currentColor">90°</text></g></svg>
