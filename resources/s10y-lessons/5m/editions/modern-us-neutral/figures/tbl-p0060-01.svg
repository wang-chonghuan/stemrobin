<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 418" role="img" aria-labelledby="title desc">
  <title id="title">Daily meat sales</title>
  <desc id="desc">Quantities in kilograms and unit prices in dollars.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="currentColor"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    </pattern>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="3"><line x1="70" y1="45" x2="70" y2="373"/><line x1="350" y1="45" x2="350" y2="373"/><line x1="590" y1="45" x2="590" y2="373"/><line x1="830" y1="45" x2="830" y2="373"/><line x1="70" y1="45" x2="830" y2="45"/><line x1="70" y1="127" x2="830" y2="127"/><line x1="70" y1="209" x2="830" y2="209"/><line x1="70" y1="291" x2="830" y2="291"/><line x1="70" y1="373" x2="830" y2="373"/></g>
     <g fill="currentColor" font-family="Arial, sans-serif" font-size="24" text-anchor="middle"><text x="210" y="95">Item</text><text x="470" y="95">Quantity</text><text x="710" y="95">Unit price</text><text x="210" y="177">Beef</text><text x="470" y="177">720 kg</text><text x="710" y="177">$1.60</text><text x="210" y="259">Pork</text><text x="470" y="259">510 kg</text><text x="710" y="259">$2.10</text><text x="210" y="341">Lamb</text><text x="470" y="341">320 kg</text><text x="710" y="341">$1.90</text></g>
</svg>
