<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img"><title>Movement on a number line</title><desc>A point moves from A at zero to B at four and C at negative two.</desc><g fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="35" y1="145" x2="325" y2="145" stroke="currentColor" stroke-width="2"/><polygon points="325,145 315,140 315,150" fill="currentColor" stroke="currentColor" stroke-width="2"/><line x1="35" y1="140" x2="35" y2="150" stroke="currentColor" stroke-width="1"/><text x="35" y="167" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="currentColor">-3</text><line x1="71.25" y1="140" x2="71.25" y2="150" stroke="currentColor" stroke-width="1"/><text x="71.25" y="167" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="currentColor">-2</text><line x1="107.5" y1="140" x2="107.5" y2="150" stroke="currentColor" stroke-width="1"/><text x="107.5" y="167" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="currentColor">-1</text><line x1="143.75" y1="140" x2="143.75" y2="150" stroke="currentColor" stroke-width="1"/><text x="143.75" y="167" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="currentColor">0</text><line x1="180" y1="140" x2="180" y2="150" stroke="currentColor" stroke-width="1"/><text x="180" y="167" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="currentColor">1</text><line x1="216.25" y1="140" x2="216.25" y2="150" stroke="currentColor" stroke-width="1"/><text x="216.25" y="167" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="currentColor">2</text><line x1="252.5" y1="140" x2="252.5" y2="150" stroke="currentColor" stroke-width="1"/><text x="252.5" y="167" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="currentColor">3</text><line x1="288.75" y1="140" x2="288.75" y2="150" stroke="currentColor" stroke-width="1"/><text x="288.75" y="167" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="currentColor">4</text><line x1="325" y1="140" x2="325" y2="150" stroke="currentColor" stroke-width="1"/><text x="325" y="167" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="currentColor">5</text><line x1="180" y1="95" x2="290" y2="95" stroke="currentColor" stroke-width="2"/><polygon points="290,95 280,90 280,100" fill="currentColor" stroke="currentColor" stroke-width="2"/><line x1="180" y1="75" x2="105" y2="75" stroke="currentColor" stroke-width="2"/><polygon points="105,75 115,70 115,80" fill="currentColor" stroke="currentColor" stroke-width="2"/><text x="180" y="130" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="currentColor">A</text><text x="290" y="130" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="currentColor">B</text><text x="105" y="130" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="currentColor">C</text></g></svg>
