<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img"><title>Intersecting lines</title><desc>Two lines AB and CD intersect at O with one angle shaded.</desc><g fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="45" y1="55" x2="315" y2="165" stroke="currentColor" stroke-width="3"/><line x1="45" y1="165" x2="315" y2="55" stroke="currentColor" stroke-width="3"/><polygon points="45,55 315,55 180,110" fill="#c7d8d5" stroke="currentColor" stroke-width="2"/><text x="34" y="52" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="currentColor">A</text><text x="326" y="52" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="currentColor">B</text><text x="34" y="177" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="currentColor">C</text><text x="326" y="177" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="currentColor">D</text><text x="180" y="130" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="currentColor">O</text></g></svg>
