<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Comparing negative numbers</title>
  <desc id="desc">Point A at negative fifteen is left of point B at negative nine.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="currentColor"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    </pattern>
  </defs>
  <g font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="currentColor">
      
      <line x1="60" y1="230" x2="842" y2="230" stroke="currentColor" stroke-width="5" marker-end="url(#arrow)"/>
      <line x1="80" y1="230" x2="80" y2="258"/>
      <text x="80" y="292">-18</text>
<line x1="265" y1="230" x2="265" y2="258"/>
      <text x="265" y="292">-15</text>
<line x1="450" y1="230" x2="450" y2="258"/>
      <text x="450" y="292">-12</text>
<line x1="635" y1="230" x2="635" y2="258"/>
      <text x="635" y="292">-9</text>
<line x1="820" y1="230" x2="820" y2="258"/>
      <text x="820" y="292">-6</text>
      <circle cx="265" cy="230" r="8" fill="#0f766e"/>
      <text x="265" y="192" fill="#0f766e">A</text>
<circle cx="635" cy="230" r="8" fill="#0f766e"/>
      <text x="635" y="192" fill="#0f766e">B</text>
    </g>
</svg>
