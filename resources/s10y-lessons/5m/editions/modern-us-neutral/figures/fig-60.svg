<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Translated circle</title>
  <desc id="desc">A circle centered at A is shifted to an equal circle centered at A1.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="currentColor"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    </pattern>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="6">
        <circle cx="260" cy="270" r="120"/><circle cx="640" cy="150" r="120"/>
        <line x1="260" y1="270" x2="640" y2="150" marker-end="url(#arrow)"/>
      </g>
      <g fill="#0f766e"><circle cx="260" cy="270" r="8"/><circle cx="640" cy="150" r="8"/></g>
      <g fill="currentColor" font-family="Arial, sans-serif" font-size="30">
        <text x="225" y="315">A</text><text x="655" y="135">A1</text>
      </g>
</svg>
