<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 254" role="img" aria-labelledby="title desc">
  <title id="title">Five-year production</title>
  <desc id="desc">Annual solar component output for one worker over five consecutive years.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="currentColor"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    </pattern>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="3"><line x1="70" y1="45" x2="70" y2="209"/><line x1="222" y1="45" x2="222" y2="209"/><line x1="374" y1="45" x2="374" y2="209"/><line x1="526" y1="45" x2="526" y2="209"/><line x1="678" y1="45" x2="678" y2="209"/><line x1="830" y1="45" x2="830" y2="209"/><line x1="70" y1="45" x2="830" y2="45"/><line x1="70" y1="127" x2="830" y2="127"/><line x1="70" y1="209" x2="830" y2="209"/></g>
     <g fill="currentColor" font-family="Arial, sans-serif" font-size="24" text-anchor="middle"><text x="146" y="95">Year 1</text><text x="298" y="95">Year 2</text><text x="450" y="95">Year 3</text><text x="602" y="95">Year 4</text><text x="754" y="95">Year 5</text><text x="146" y="177">9,532</text><text x="298" y="177">11,864</text><text x="450" y="177">14,139</text><text x="602" y="177">17,313</text><text x="754" y="177">20,824</text></g>
</svg>
