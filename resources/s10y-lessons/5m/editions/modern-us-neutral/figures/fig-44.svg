<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img"><title>Central symmetry of a figure</title><desc>Two simple human figures are related by a half-turn about O.</desc><g fill="none" stroke-linecap="round" stroke-linejoin="round"><g stroke="currentColor" stroke-width="5"><circle cx="105" cy="70" r="12" fill="none" stroke="currentColor" stroke-width="2"/><line x1="105" y1="82" x2="105" y2="125" stroke="currentColor" stroke-width="2"/><line x1="105" y1="95" x2="80" y2="115" stroke="currentColor" stroke-width="2"/><line x1="105" y1="95" x2="130" y2="112" stroke="currentColor" stroke-width="2"/><line x1="105" y1="125" x2="85" y2="165" stroke="currentColor" stroke-width="2"/><line x1="105" y1="125" x2="130" y2="160" stroke="currentColor" stroke-width="2"/><circle cx="255" cy="150" r="12" fill="none" stroke="currentColor" stroke-width="2"/><line x1="255" y1="138" x2="255" y2="95" stroke="currentColor" stroke-width="2"/><line x1="255" y1="125" x2="230" y2="105" stroke="currentColor" stroke-width="2"/><line x1="255" y1="125" x2="280" y2="108" stroke="currentColor" stroke-width="2"/><line x1="255" y1="95" x2="235" y2="55" stroke="currentColor" stroke-width="2"/><line x1="255" y1="95" x2="280" y2="60" stroke="currentColor" stroke-width="2"/><line x1="140" y1="140" x2="220" y2="80" stroke="currentColor" stroke-width="2"/><circle cx="180" cy="110" r="5" fill="currentColor" stroke="currentColor" stroke-width="2"/></g><text x="90" y="45" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="currentColor">F</text><text x="270" y="180" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="currentColor">F1</text><text x="180" y="100" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="currentColor">O</text></g></svg>
