<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Order on a number line</title>
  <desc id="desc">Negative eight, negative three, zero, and five are shown from left to right.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="currentColor"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    </pattern>
  </defs>
  <g font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="currentColor">
      
      <line x1="60" y1="230" x2="842" y2="230" stroke="currentColor" stroke-width="5" marker-end="url(#arrow)"/>
      <line x1="162.22222222222223" y1="230" x2="162.22222222222223" y2="258"/>
      <text x="162.22222222222223" y="292">-8</text>
<line x1="367.77777777777777" y1="230" x2="367.77777777777777" y2="258"/>
      <text x="367.77777777777777" y="292">-3</text>
<line x1="491.11111111111114" y1="230" x2="491.11111111111114" y2="258"/>
      <text x="491.11111111111114" y="292">0</text>
<line x1="696.6666666666667" y1="230" x2="696.6666666666667" y2="258"/>
      <text x="696.6666666666667" y="292">5</text>
      
    </g>
<g fill="currentColor" font-family="Arial, sans-serif" font-size="26" text-anchor="middle">
        <text x="260" y="380">-8 &lt; 5</text><text x="450" y="380">-8 &lt; -3</text><text x="650" y="380">-3 &gt; -8</text>
      </g></svg>
