<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img"><title>Road route map</title><desc>A simple route between four towns with distances in kilometers.</desc><g fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="45" y1="55" x2="155" y2="110" stroke="currentColor" stroke-width="4"/><line x1="155" y1="110" x2="255" y2="75" stroke="currentColor" stroke-width="4"/><line x1="155" y1="110" x2="305" y2="165" stroke="currentColor" stroke-width="4"/><circle cx="45" cy="55" r="5" fill="currentColor" stroke="currentColor" stroke-width="2"/><circle cx="155" cy="110" r="5" fill="currentColor" stroke="currentColor" stroke-width="2"/><circle cx="255" cy="75" r="5" fill="currentColor" stroke="currentColor" stroke-width="2"/><circle cx="305" cy="165" r="5" fill="currentColor" stroke="currentColor" stroke-width="2"/><text x="40" y="38" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="currentColor">Lakeview</text><text x="145" y="132" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="currentColor">Riverton</text><text x="265" y="58" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="currentColor">Pine Ridge</text><text x="300" y="190" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="currentColor">New Haven</text><text x="90" y="70" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="currentColor">260 km</text><text x="205" y="88" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="currentColor">270 km</text><text x="245" y="145" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="currentColor">630 km</text></g></svg>
