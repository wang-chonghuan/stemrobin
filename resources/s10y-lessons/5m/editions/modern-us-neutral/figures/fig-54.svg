    <path d="M160 300L248 232"/>
    <path d="M360 300L351 235"/>
    <path d="M640 300L649 235"/>
    <path d="M840 300L752 232"/>
    <path d="M65 490L119 376"/>
    <path d="M185 490L194 377"/>
    <path d="M305 490L323 377"/>
    <path d="M425 490L398 377"/>
    <path d="M575 490L602 377"/>
    <path d="M695 490L677 377"/>
    <path d="M815 490L806 377"/>
