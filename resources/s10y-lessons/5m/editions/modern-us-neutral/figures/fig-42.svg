<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img"><title>Symmetric points on a segment</title><desc>Points A and B lie equally far from midpoint O.</desc><g fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="45" y1="175" x2="305" y2="45" stroke="currentColor" stroke-width="4"/><circle cx="45" cy="175" r="5" fill="currentColor" stroke="currentColor" stroke-width="2"/><circle cx="175" cy="110" r="5" fill="currentColor" stroke="currentColor" stroke-width="2"/><circle cx="305" cy="45" r="5" fill="currentColor" stroke="currentColor" stroke-width="2"/><text x="35" y="190" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="currentColor">A</text><text x="175" y="100" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="currentColor">O</text><text x="315" y="40" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="currentColor">B</text></g></svg>
