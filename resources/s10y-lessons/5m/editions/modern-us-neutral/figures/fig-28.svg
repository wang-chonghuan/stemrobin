<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img"><title>Sticks that cannot close</title><desc>Two short sticks cannot meet above a longer base.</desc><g fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="45" y1="175" x2="315" y2="175" stroke="currentColor" stroke-width="12"/><line x1="45" y1="175" x2="100" y2="70" stroke="currentColor" stroke-width="12"/><line x1="315" y1="175" x2="260" y2="70" stroke="currentColor" stroke-width="12"/><circle cx="45" cy="175" r="7" fill="white" stroke="currentColor" stroke-width="2"/><circle cx="315" cy="175" r="7" fill="white" stroke="currentColor" stroke-width="2"/><circle cx="100" cy="70" r="7" fill="white" stroke="currentColor" stroke-width="2"/><circle cx="260" cy="70" r="7" fill="white" stroke="currentColor" stroke-width="2"/><text x="35" y="200" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="currentColor">A</text><text x="325" y="200" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="currentColor">B</text><text x="100" y="55" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="currentColor">C</text><text x="260" y="55" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="currentColor">D</text></g></svg>
