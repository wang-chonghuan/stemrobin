<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img"><title>Outdoor thermometer dial</title><desc>A circular temperature dial with negative and positive sides.</desc><g fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="180" cy="110" r="85" fill="none" stroke="currentColor" stroke-width="2"/><line x1="180" y1="110" x2="245" y2="160" stroke="currentColor" stroke-width="8"/><circle cx="180" cy="110" r="9" fill="currentColor" stroke="currentColor" stroke-width="2"/><text x="180" y="35" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="currentColor">40</text><text x="245" y="55" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="currentColor">30</text><text x="270" y="110" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="currentColor">20</text><text x="235" y="178" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="currentColor">10</text><text x="180" y="205" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="currentColor">0</text><text x="105" y="178" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="currentColor">-10</text><text x="85" y="110" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="currentColor">-20</text><text x="110" y="55" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="currentColor">-30</text><text x="200" y="90" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="currentColor">+</text><text x="145" y="90" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="currentColor">−</text></g></svg>
