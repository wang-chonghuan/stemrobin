<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Coordinates on a curve</title>
  <desc id="desc">A smooth increasing curve crosses the coordinate plane.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="currentColor"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    </pattern>
  </defs>
  <g fill="none" stroke="#cbd5e1" stroke-width="1.5"><line x1="70" y1="40" x2="70" y2="480"/><line x1="165" y1="40" x2="165" y2="480"/><line x1="260" y1="40" x2="260" y2="480"/><line x1="355" y1="40" x2="355" y2="480"/><line x1="450" y1="40" x2="450" y2="480"/><line x1="545" y1="40" x2="545" y2="480"/><line x1="640" y1="40" x2="640" y2="480"/><line x1="735" y1="40" x2="735" y2="480"/><line x1="830" y1="40" x2="830" y2="480"/><line x1="70" y1="480" x2="830" y2="480"/><line x1="70" y1="425" x2="830" y2="425"/><line x1="70" y1="370" x2="830" y2="370"/><line x1="70" y1="315" x2="830" y2="315"/><line x1="70" y1="260" x2="830" y2="260"/><line x1="70" y1="205" x2="830" y2="205"/><line x1="70" y1="150" x2="830" y2="150"/><line x1="70" y1="95" x2="830" y2="95"/><line x1="70" y1="40" x2="830" y2="40"/></g>
     <g fill="none" stroke="currentColor" stroke-width="4">
       <line x1="70" y1="260" x2="838" y2="260" marker-end="url(#arrow)"/>
       <line x1="450" y1="480" x2="450" y2="32" marker-end="url(#arrow)"/>
       
       <path d="M70 425C210 390 300 330 360 280C420 230 420 155 500 115C585 72 690 85 830 55" stroke="#0f766e" stroke-width="7" fill="none"/>
     </g>
     <g fill="currentColor" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">
       <text x="855" y="268">x</text>
       <text x="432" y="35">y</text>
       <g font-size="15"><text x="70" y="280">-4</text><text x="165" y="280">-3</text><text x="260" y="280">-2</text><text x="355" y="280">-1</text><text x="545" y="280">1</text><text x="640" y="280">2</text><text x="735" y="280">3</text><text x="830" y="280">4</text><text x="435" y="486">-4</text><text x="435" y="431">-3</text><text x="435" y="376">-2</text><text x="435" y="321">-1</text><text x="435" y="211">1</text><text x="435" y="156">2</text><text x="435" y="101">3</text><text x="435" y="46">4</text><text x="436" y="280">0</text></g>
       
     </g>
</svg>
